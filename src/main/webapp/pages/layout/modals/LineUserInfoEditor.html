<!--此html表單將用來編輯line Id以及driver user之間的資料連結-->
<div id="LineUserInfoEditor" class="modal fade" tabindex="-1" role="dialog" >
    <div class="modal-dialog modal-lg">
        <div class="modal-content bg-dark text-white" style="border: 2px solid white;"> <!-- 加入白色邊框 -->
            <div class="modal-header">
                <h3 class="modal-title text-white">Line 通訊錄</h3>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="editForm">
                    <div class="row mt-2 ">
                        <!-- userId -->
                        <div class="input-group col-md-6 mb-2">
                            <label for="userId" class="input-group-text ">Line ID</label>
                            <input type=hidden  id="serialID" data-serialId="" value=""  >
                            <input type="text" id="userId"  data-userId="" class="form-control fc-0" aria-describedby="basic-addon1" readonly >
                        </div>
                        <!-- displayName Line User 本身登錄名稱-->
                        <div class="input-group col-md-6 mb-2">
                            <label for="displayName" class="input-group-text ">Line 暱稱</label>
                            <input type="text" id="displayName" data-displayname="" class="form-control fc-0" aria-describedby="basic-addon1" readonly >
                        </div>
                    </div>

                    <div class="row mt-2">
                        <!-- driverPortable -->
                        <div class="input-group col-md-6 mb-2">
                            <label class="input-group-text ">Portable</label>
                            <input type="text" class="form-control  fc-0"
                                   id="driverPortable" name="driverPortable" data-driverPortable=""    aria-describedby="basic-addon1" readonly>
                        </div>
                        <!-- driverName -->
                        <div class="input-group col-md-6 mb-2">
                            <label class="input-group-text ">姓名</label>
                            <input type="text" class="form-control  fc-0"
                                   id="driverName" name="driverName" aria-describedby="basic-addon1" readonly>
                        </div>
                    </div>

                    <div class="row mt-2">
                        <!-- driverSC -->
                        <div class="input-group col-md-6  mb-2">
                            <input id="driverSeq" type=hidden name="driverSeq" data-driverSeq="" value=""/>
                            <label for="driverSC" class="input-group-text">特別碼</label>
                            <input type="text" id="driverSC" name="driverSC" data-driverSC="" class="form-control fc-0"  >
                            <!-- List container for search results -->
                            <ul class="dropdown-menu list-window w-25" id="autocomplete-list-driverSC"/>
                        </div>
                        <!-- driverID -->
                        <div class="input-group col-md-6  mb-2">
                            <label for="driverId" class="input-group-text ">身分證號</label>
                            <input type="text" id="driverId" name="driverId" data-driverID="" class="form-control fc-0" >
                            <!-- List container for search results -->
                            <ul class="dropdown-menu list-window w-25" id="autocomplete-list-driverId"/>
                        </div>
                    </div>

                    <div class="row mt-2">
                        <!-- Tag (佔據兩倍寬度) -->
                        <div class="input-group col-md-12  mb-2">
                            <label for="tag" class="input-group-text ">標籤</label>
                            <input type="text" id="tag" name="tag" data-tag="" class="form-control fc-0">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">關閉</button>
                <button type="submit" id="btnSubmit" class="btn btn-primary">儲存</button>
            </div>
        </div>
    </div>
</div>
