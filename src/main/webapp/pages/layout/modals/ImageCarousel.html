<!-- Bootstrap Carousel Modal -->
<div class="modal fade" id="imageCarouselModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header d-flex justify-content-between align-items-center">
                <h5 class="modal-title">已上傳圖片預覽 🖼️</h5>

                <div class="d-flex">
                    <!-- 更新按鈕 -->
                    <button id="updateImageBtn" class="btn btn-sm btn-secondary ml-1" title="更新後台">
                        <i class="fas fa-sync-alt"></i> 更新
                    </button>

                    <!-- 旋轉按鈕 -->
                    <button id="rotateImageBtn" class="btn btn-sm btn-secondary ml-1" title="旋轉圖片">
                        <i class="fas fa-sync-alt"></i> 旋轉
                    </button>

                    <!-- 關閉按鈕 -->
                    <button type="button" class="btn-close btn btn-sm btn-secondary ml-1" data-bs-dismiss="modal">
                        <i class="fas fa-sync-alt"></i> 關閉
                    </button>
                </div>

            </div>
            <div class="modal-body">
                <div id="carouselPreview" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner"></div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#carouselPreview" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon"></span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carouselPreview" data-bs-slide="next">
                        <span class="carousel-control-next-icon"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
